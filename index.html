<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ================= 3D PREMIUM BACKGROUND ================= */
const canvas = document.getElementById('bg3d');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x07070c, 0.028);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, .1, 200);
camera.position.set(0, 2, 26);

/* ---- lights ---- */
scene.add(new THREE.AmbientLight(0xffffff, .35));
const keyLight = new THREE.PointLight(0xd4af37, 2.2, 90); keyLight.position.set(10, 14, 12); scene.add(keyLight);
const redLight = new THREE.PointLight(0xe10600, 1.8, 70); redLight.position.set(-14, -6, 8); scene.add(redLight);
const rimLight = new THREE.DirectionalLight(0x6b7cff, .5); rimLight.position.set(0, 8, -20); scene.add(rimLight);

/* ---- golden particle field ---- */
const pCount = 1400;
const pGeo = new THREE.BufferGeometry();
const pos = new Float32Array(pCount*3), col = new Float32Array(pCount*3);
const gold = new THREE.Color(0xd4af37), crimson = new THREE.Color(0xe10600);
for (let i=0;i<pCount;i++){
  pos[i*3]   = (Math.random()-.5)*90;
  pos[i*3+1] = (Math.random()-.5)*60;
  pos[i*3+2] = (Math.random()-.5)*70;
  const c = Math.random() < .82 ? gold : crimson;
  col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b;
}
pGeo.setAttribute('position', new THREE.BufferAttribute(pos,3));
pGeo.setAttribute('color', new THREE.BufferAttribute(col,3));
const particles = new THREE.Points(pGeo, new THREE.PointsMaterial({
  size:.16, vertexColors:true, transparent:true, opacity:.85,
  blending:THREE.AdditiveBlending, depthWrite:false
}));
scene.add(particles);

/* ---- floating premium geometry ---- */
const group = new THREE.Group(); scene.add(group);
const goldMat = new THREE.MeshStandardMaterial({ color:0xd4af37, metalness:.95, roughness:.18 });
const darkMat = new THREE.MeshStandardMaterial({ color:0x1a1a24, metalness:.8, roughness:.3 });

const torus = new THREE.Mesh(new THREE.TorusKnotGeometry(4.6, 1.05, 220, 32), goldMat);
torus.position.set(-13, 3, -8); group.add(torus);

const ico = new THREE.Mesh(new THREE.IcosahedronGeometry(3.4, 0), darkMat);
ico.position.set(14, -3, -10); group.add(ico);
const icoWire = new THREE.Mesh(new THREE.IcosahedronGeometry(3.55, 0),
  new THREE.MeshBasicMaterial({ color:0xd4af37, wireframe:true, transparent:true, opacity:.5 }));
icoWire.position.copy(ico.position); group.add(icoWire);

const octa = new THREE.Mesh(new THREE.OctahedronGeometry(2.2, 0), goldMat.clone());
octa.position.set(9, 9, -16); group.add(octa);

/* ---- low grid floor ---- */
const grid = new THREE.GridHelper(140, 46, 0xd4af37, 0x2a2a38);
grid.position.y = -14;
grid.material.transparent = true; grid.material.opacity = .16;
scene.add(grid);

/* ---- mouse parallax ---- */
let mx=0, my=0;
addEventListener('mousemove', e => {
  mx = (e.clientX/innerWidth - .5);
  my = (e.clientY/innerHeight - .5);
});

const clock = new THREE.Clock();
(function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  particles.rotation.y = t*.025;
  torus.rotation.x = t*.22; torus.rotation.y = t*.3;
  ico.rotation.x = t*.16; ico.rotation.z = t*.2;
  icoWire.rotation.copy(ico.rotation);
  octa.rotation.y = t*.4; octa.position.y = 9 + Math.sin(t*.9)*1.1;
  torus.position.y = 3 + Math.sin(t*.7)*1.3;
  grid.position.z = (t*1.4) % 3;

  camera.position.x += (mx*6 - camera.position.x)*.04;
  camera.position.y += (2 - my*4 - camera.position.y)*.04;
  camera.lookAt(0, 0, -6);

  renderer.render(scene, camera);
})();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* track content view */
fbq('track', 'ViewContent');
</script>
